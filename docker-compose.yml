# Local development: three containers (team dev strategy).
#   docker compose up --build
#   Portal:  http://localhost:5173        API docs: http://localhost:${API_HOST_PORT:-8000}/docs
#   Mailpit: http://localhost:8025        (catches every email; nothing leaves your machine)
#
# If port 8000 is already used on your machine, set API_HOST_PORT=8010 in .env.

services:
  api:
    build: ./backend
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Always Mailpit in dev, whatever .env says: no login, no TLS, no real emails (SRS §8)
      SMTP_HOST: mailpit          # inside Docker, Mailpit is reached by its service name
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "false"
      DATABASE_URL: sqlite:///./data/portal.db
      FILE_STORAGE_PATH: ./data/files
      CORS_ALLOW_ORIGINS: http://localhost:5173
      PORTAL_BASE_URL: http://localhost:5173
    volumes:
      - ./:/repo                  # code (auto-reload) + experiments; SQLite and files in backend/data/
    depends_on:
      - mailpit

  web:
    image: node:22-alpine
    working_dir: /repo
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -w frontend -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-8000}   # the browser calls the API
    volumes:
      - ./:/repo
      - node_modules:/repo/node_modules   # Linux packages stay inside Docker
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  node_modules:
